# Builds the Windows app (desktop/) on a Windows runner and attaches the installers to a draft
# GitHub release. Run it from the Actions tab ("Run workflow"), or push a tag `desktop-v*`.
# Actions are pinned to full commit SHAs.
name: Desktop app (Windows)

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: write # create the draft release and upload installers

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri

      - name: Install the Tauri CLI (pinned by package-lock.json)
        run: npm ci --ignore-scripts

      - name: Unit tests
        working-directory: desktop/src-tauri
        run: cargo test --lib --locked

      - name: Build installers and attach them to a draft release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: desktop-v__VERSION__
          releaseName: Kiln for Windows v__VERSION__
          releaseBody: |
            Windows installers for the Kiln desktop app. They aren't code-signed, so
            Windows SmartScreen will ask you to confirm the first time ("More info" → "Run anyway").
            On first launch, enter your Kiln address (https://<server>.<tailnet>.ts.net).
          releaseDraft: true
          prerelease: false
