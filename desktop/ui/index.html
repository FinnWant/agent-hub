<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Hub</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <main>
      <form id="connect" autocomplete="on">
        <div class="brand"><span class="mark"></span>Agent Hub</div>
        <p>Connect to your Agent Hub server. Use the address you open it at in a browser, for example
          <code>https://myserver.tailnet.ts.net</code>.</p>
        <label for="url">Server address</label>
        <input id="url" name="url" type="url" required placeholder="https://myserver.tailnet.ts.net" spellcheck="false" />
        <p id="error" role="alert" hidden></p>
        <button type="submit">Connect</button>
        <small>Your Tailscale must be connected. You can change the server later from the tray icon.</small>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
